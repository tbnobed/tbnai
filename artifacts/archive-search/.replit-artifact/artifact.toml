kind = "web"
previewPath = "/"
title = "Archive Search"
version = "1.0.0"
id = "artifacts/archive-search"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 24660

[services.development]
run = "pnpm --filter @workspace/archive-search run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/archive-search", "run", "build" ]
serve = "static"
publicDir = "artifacts/archive-search/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "24660"
BASE_PATH = "/"
