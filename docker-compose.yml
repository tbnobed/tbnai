version: "3.9"

# ─────────────────────────────────────────────
# Broadcasting Ministry — Book Archive RAG Tool
# ─────────────────────────────────────────────
# Usage:
#   1. Copy .env.example to .env and fill in all required values
#   2. Place book files in ./books/ (mounted into the API container)
#   3. docker compose up -d
#
# Services:
#   db      PostgreSQL 16 + pgvector
#   api     Express backend (RAG pipeline, REST API, Clerk auth proxy)
#   web     Nginx serving the built React frontend
#
# Book ingestion:
#   After registering a book via POST /api/books you can trigger
#   reindexing via POST /api/books/:id/reindex.
#   The filePath field must be a path inside the container, e.g.
#   /books/my-book.pdf (maps to ./books/my-book.pdf on the host).

services:

  # ── PostgreSQL 16 with pgvector ──────────────────────────────────────────
  db:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-archive}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-archive_db}
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./docker/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-archive} -d ${POSTGRES_DB:-archive_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── One-shot schema migration (runs before the API) ──────────────────────
  migrate:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
      target: builder
    command: ["pnpm", "--filter", "@workspace/db", "run", "push-force"]
    restart: "no"
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-archive}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-archive_db}
      EMBEDDING_DIMENSIONS: ${EMBEDDING_DIMENSIONS:-1536}

  # ── Express API (RAG + REST + Clerk proxy) ───────────────────────────────
  api:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      NODE_ENV: production
      PORT: 3001
      DATABASE_URL: postgresql://${POSTGRES_USER:-archive}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-archive_db}

      # ── Self-hosted auth ──
      SESSION_SECRET: ${SESSION_SECRET}
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}

      # ── Local LLM (DGX Spark / OpenAI-compatible endpoint) ──
      OPENAI_BASE_URL: ${OPENAI_BASE_URL}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-local}
      CHAT_MODEL: ${CHAT_MODEL:-gpt-oss-120b}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-text-embedding-3-small}
      EMBEDDING_DIMENSIONS: ${EMBEDDING_DIMENSIONS:-1536}

      # ── RAG tuning ──
      RAG_TOP_K: ${RAG_TOP_K:-8}
      RAG_MIN_SIMILARITY: ${RAG_MIN_SIMILARITY:-0.3}

      # ── Ingest tuning ──
      INGEST_CHUNK_SIZE: ${INGEST_CHUNK_SIZE:-600}
      INGEST_CHUNK_OVERLAP: ${INGEST_CHUNK_OVERLAP:-100}
      INGEST_EMBED_BATCH: ${INGEST_EMBED_BATCH:-10}

      # ── SendGrid (invite emails) ──
      SENDGRID_API_KEY: ${SENDGRID_API_KEY}
      SENDGRID_FROM_EMAIL: ${SENDGRID_FROM_EMAIL}
      SENDGRID_FROM_NAME: ${SENDGRID_FROM_NAME:-Archive Search}
      APP_BASE_URL: ${APP_BASE_URL}

      LOG_LEVEL: ${LOG_LEVEL:-info}
    volumes:
      # Mount your book files here. Register a book with filePath: /books/filename.pdf
      - ${BOOKS_DIR:-./books}:/books:ro
    ports:
      - "3001:3001"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:3001/api/healthz || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5

  # ── Nginx — static React frontend ───────────────────────────────────────
  web:
    build:
      context: .
      dockerfile: docker/Dockerfile.web
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    environment:
      API_URL: http://api:3001
    ports:
      - "${WEB_PORT:-80}:80"

volumes:
  db_data:
